<mat-dialog-content class="custom-dialog-content">
  <mat-card>
    <mat-card-title>Dar ingreso</mat-card-title>
    <mat-card-content>
      <mat-divider></mat-divider>
      <p><strong>Ciudadano:</strong> {{ data.cita.nombre_citizen }}</p>
      <p>
        <strong>Fecha:</strong>
        {{ data.cita.fec_registro || (data.cita.fecha_cita | date:'dd/MM/yyyy hh:mm a' ) }}
      </p>

      <mat-divider></mat-divider>

    </mat-card-content>
  </mat-card>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()">Ingresar</button>
</mat-dialog-actions>
