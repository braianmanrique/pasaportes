<div class="citas-container">
    <mat-toolbar color="primary" class="toolbar">
      <span class="spacer"></span>
      <mat-form-field class="filter-input">
        <mat-label>Buscar Cita</mat-label>
        <input
          matInput
          (keyup)="applyFilter($event)"
          placeholder="Ingresa nombre o cédula"
        />
      </mat-form-field>
      <button mat-icon-button color="accent" (click)="reloadCitas()">
        <mat-icon>refresh</mat-icon>
      </button>
    </mat-toolbar>
  
   
    <!-- Tabla de Citas Normales -->
    <mat-card class="card">
      <mat-card-title>Citas por Atender</mat-card-title>
      <mat-divider></mat-divider>
      <div class="mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort class="styled-table">
          <!-- Turno -->
          <ng-container matColumnDef="turn_desc">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Turno</th>
            <td mat-cell *matCellDef="let row">
              {{ row.turn_desc  }}
            </td>
          </ng-container>
  
          <!-- Estado -->
          <ng-container matColumnDef="atendida">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
            <td mat-cell *matCellDef="let element">
              {{ getAtendidaLabel(element.atendida) }}
            </td>
          </ng-container>
  
          <ng-container matColumnDef="cedula">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Cédula</th>
            <td mat-cell *matCellDef="let row">{{ row.cedula }}</td>
          </ng-container>
  
          <!-- Nombre ciudadano -->
          <ng-container matColumnDef="nombre_citizen">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let row">{{ row.nombre_citizen }}</td>
          </ng-container>
  
          <!-- Acción -->
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Acción</th>
            <td mat-cell *matCellDef="let row">
              <button
                mat-icon-button
                color="accent"
                (click)="openDialog(row)"
              >
                <mat-icon>login</mat-icon>
              </button>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="4">No hay citas disponibles.</td>
          </tr>
        </table>
        <mat-paginator
          [pageSizeOptions]="[5, 10, 20]"
          showFirstLastButtons
        ></mat-paginator>
      </div>
    </mat-card>
  </div>
